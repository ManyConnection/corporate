<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>お問い合わせありがとうございます</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />
    <meta http-equiv="refresh" content="0; url=/contact-success" />
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #ffffff;
        color: #121212;
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
      }
      main {
        background: #ffffff;
        border: 1px solid #e5e5e5;
        padding: 48px 40px;
        max-width: 460px;
        text-align: center;
      }
      h1 {
        font-size: 24px;
        margin-bottom: 16px;
        letter-spacing: -0.01em;
      }
      p {
        margin-bottom: 24px;
        line-height: 1.6;
        color: #666666;
      }
      a {
        display: inline-block;
        padding: 12px 28px;
        background: #121212;
        color: #ffffff;
        text-decoration: none;
        font-weight: 600;
        transition: opacity 0.2s ease;
      }
      a:hover {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>お問い合わせありがとうございます</h1>
      <p>
        送信内容を受け付けました。担当者より折り返しご連絡いたしますので、しばらくお待ちください。
      </p>
      <a href="/">トップページに戻る</a>
    </main>
  </body>
</html>
